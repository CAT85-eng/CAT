<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>维护中</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0A0A0E;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        /* 弹窗容器 */
        .dialog {
            background: #14141A;
            border: 1px solid #22222C;
            border-radius: 14px;
            padding: 36px 32px 32px;
            width: 280px;
            text-align: center;
            animation: dialogIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes dialogIn {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* Google G */
        .google-g {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
        }

        .google-g svg {
            width: 100%;
            height: 100%;
        }

        /* 标题 */
        .dialog h2 {
            font-size: 15px;
            font-weight: 500;
            color: #E8E8EC;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        /* 描述 */
        .dialog p {
            font-size: 12px;
            color: #666672;
            letter-spacing: 0.5px;
            margin-bottom: 22px;
        }

        /* 进度条 */
        .progress {
            width: 100%;
            height: 2px;
            background: #22222C;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-inner {
            width: 35%;
            height: 100%;
            background: #4A7DFF;
            border-radius: 2px;
            animation: progressMove 1.4s cubic-bezier(0.45, 0, 0.55, 1) infinite;
        }

        @keyframes progressMove {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(385%);
            }
        }
    </style>
</head>
<body>
    <div class="dialog">
        <!-- Google G 图标 -->
        <div class="google-g">
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" fill="#4285F4"/>
                <path d="M12 6c-1.66 0-3.22.66-4.36 1.73L6.2 6.29C7.76 4.76 9.78 4 12 4c2.22 0 4.24.76 5.8 2.29l-1.44 1.44C15.22 6.66 13.66 6 12 6z" fill="#EA4335"/>
                <path d="M6.2 6.29C4.76 7.76 4 9.78 4 12s.76 4.24 2.29 5.8l1.44-1.44C6.66 15.22 6 13.66 6 12s.66-3.22 1.73-4.36L6.2 6.29z" fill="#FBBC05"/>
                <path d="M20 12c0-2.22-.76-4.24-2.29-5.8l-1.44 1.44C17.34 8.78 18 10.34 18 12s-.66 3.22-1.73 4.36l1.44 1.44C19.24 16.24 20 14.22 20 12z" fill="#34A853"/>
            </svg>
        </div>

        <h2>正在维护</h2>
        <p>请稍候，马上回来</p>

        <div class="progress">
            <div class="progress-inner"></div>
        </div>
    </div>
</body>
</html>
